[package]
edition = "2024"
name = "hello-agents"
version = "0.1.0"

[dependencies]
dotenvy = "0.15"
futures-util = "0.3"
reqwest = { version = "0.13", features = ["json"] }
rig = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tavily = "2.1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
