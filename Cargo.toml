[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
dotenvy = "0.15"
futures-util = "0.3"
reqwest = { version = "0.13", features = ["json"] }
rig = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serpapi = "1.1.0"
tavily = "2.1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
